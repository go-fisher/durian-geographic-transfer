ability</tspan></text><line x1="813.3" y1="514" x2="840" y2="514" stroke="#183C6B" stroke-width="1"/><rect x="545" y="531" width="300" height="96" rx="7" fill="url(#purpleFill)" stroke="#5149A3" stroke-width="1.25" filter="url(#softShadow)"/><text x="695" y="565" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="17.5" font-weight="700" fill="#0B2B5C" ><tspan x="695" dy="0">E5 target-domain learnability</tspan></text><text x="695" y="590" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="400" fill="#163C6F" ><tspan x="695" dy="0">post-hoc grouped modelling</tspan><tspan x="695" dy="21">with Pahang labels; OA = 0.836</tspan></text><rect x="134" y="647" width="752" height="89" rx="7" fill="#FFFFFF" stroke="#6D89AE" stroke-width="1.25" stroke-dasharray="6 4"/><text x="510" y="675" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-weight="700" fill="#0B2B5C" ><tspan x="510" dy="0">Supplementary Post-hoc Diagnostics</tspan></text><line x1="509" y1="685" x2="509" y2="721" stroke="#91A3BB" stroke-width="1"/><text x="321" y="699" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="400" fill="#163C6F" ><tspan x="321" dy="0">E4 fixed-R1 feature sensitivity</tspan><tspan x="321" dy="20">(no retroactive reselection)</tspan></text><text x="697" y="699" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="400" fill="#163C6F" ><tspan x="697" dy="0">E6 Rubber coverage sensitivity</tspan><tspan x="697" dy="20">(non-causal repeated reductions)</tspan></text></svg>