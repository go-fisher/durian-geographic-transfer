ment</tspan></text><text x="387" y="211" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="14.5" font-weight="400" fill="#163C6F" ><tspan x="387" dy="0">RF / XGBoost / SVM</tspan><tspan x="387" dy="21">nested grouped OOF</tspan></text><text x="631.5" y="159" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="700" fill="#0B2B5C" ><tspan x="631.5" dy="0">Full-Bentong staged</tspan><tspan x="631.5" dy="24">selection</tspan></text><text x="631.5" y="211" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="400" fill="#163C6F" ><tspan x="631.5" dy="0">S2: priority Durian F1</tspan><tspan x="631.5" dy="21">R1 selected within S2</tspan></text><text x="864.5" y="169" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="18.5" font-weight="700" fill="#0B2B5C" ><tspan x="864.5" dy="0">Frozen S2+R1</tspan></text><text x="864.5" y="205" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="400" fill="#163C6F" ><tspan x="864.5" dy="0">predictors + preprocessing</tspan><tspan x="864.5" dy="21">fixed before Pahang</tspan></text><line x1="254" y1="185" x2="274" y2="185" stroke="#0B2B5C" stroke-width="4" marker-end="url(#arrow)"/><line x1="499" y1="185" x2="519" y2="185" stroke="#0B2B5C" stroke-width="4" marker-end="url(#arrow)"/><line x1="743" y1="185" x2="759" y2="185" stroke="#0B2B5C" stroke-width="4" marker-end="url(#arrow)"/><path d="M854.5 251 V289 H281 V311 M854.5 289 H695 V311" fill="none" stroke="#0B2B5C" stroke-width="3" stroke-linejoin="round"/><line x1="143" y1="327" x2="172.6" y2="327" stroke="#183C6B" stroke-width="1"/><text x="283.5" y="331" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="14.5" font-weight="700" fill="#0B2B5C" ><tspan x="283.5" dy="0">5a. Source-Domain Benchmark</tspan></text><line x1="394.4" y1="327" x2="424" y2="327" stroke="#